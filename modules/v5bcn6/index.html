  .modulex-alt-tasan-bulten-logo { display: inline-flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
  .modulex-alt-tasan-bulten-logo img { width: auto; max-height: --logoH--; }

  .modulex-alt-tasan-bulten-bbaslik { margin-block-end: 14px; color: --accentInk--; font-size: 0.8rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
  .modulex-alt-tasan-bulten-sayfalar, .modulex-alt-tasan-bulten-baglantilar, .modulex-alt-tasan-bulten-iletisim, .modulex-alt-tasan-bulten-yasal { display: grid; gap: 9px; }
  .modulex-alt-tasan-bulten-il { display: flex; align-items: flex-start; gap: 10px; }
  .modulex-alt-tasan-bulten-il-ic { display: grid; gap: 2px; }

  .modulex-alt-tasan-bulten-il-ikon { flex: none; color: --accentInk--; font-size: 20px; }
  .modulex-alt-tasan-bulten-saatler { display: grid; gap: 6px; }
  .modulex-alt-tasan-bulten-saat { display: flex; justify-content: space-between; gap: 16px; }
  .modulex-alt-tasan-bulten-saat dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .modulex-alt-tasan-bulten-sosyal { display: flex; flex-wrap: wrap; gap: 10px; }
  .modulex-alt-tasan-bulten-sosyal-a { display: inline-grid; place-items: center; width: 42px; height: 42px; border: 1px solid --cizgi--; border-radius: 50%; color: inherit; font-size: 18px; transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.25s ease; }
  .modulex-alt-tasan-bulten-sosyal-a:hover { border-color: --accent--; background: --accent--; color: --accentText--; transform: translateY(-2px); }
  .modulex-alt-tasan-bulten-hakkinda { max-width: 46ch; color: --muted--; }
  .modulex-alt-tasan-bulten-telif { display: flex; flex-wrap: wrap; gap: 4px 14px; color: --muted--; font-size: 0.9rem; }
  .modulex-alt-tasan-bulten-dil:empty { display: none; }
  .modulex-alt-tasan-bulten-yukari { display: inline-grid; place-items: center; flex: none; width: 46px; height: 46px; border-radius: 50%; background: --accent--; color: --accentText--; text-decoration: none; transition: transform 0.25s ease; }
  .modulex-alt-tasan-bulten-yukari:hover { transform: translateY(-3px); }
  .modulex-alt-tasan-bulten-bulten { display: grid; gap: 8px; }
  .modulex-alt-tasan-bulten-nl-etiket { font-size: 0.9rem; font-weight: 700; }
  .modulex-alt-tasan-bulten-nl-satir { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-alt-tasan-bulten-nl-girdi { flex: 1 1 200px; min-width: 0; min-height: 48px; padding: 10px 18px; border: 1px solid --cizgi--; border-radius: 999px; background: --bg--; color: --text--; font: inherit; }
  .modulex-alt-tasan-bulten-nl-dugme { display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 10px 22px; border: 0; border-radius: 999px; background: --accent--; color: --accentText--; font: inherit; font-weight: 700; transition: transform 0.2s ease; }
  .modulex-alt-tasan-bulten-nl-dugme:hover { transform: translateY(-2px); }
  .modulex-alt-tasan-bulten-nl-dugme .material-symbols-outlined { font-size: 18px; }
  .modulex-alt-tasan-bulten-nl-durum:empty { display: none; }
  .modulex-alt-tasan-bulten-nl-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.4rem, 2.6vw, 2rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
  .modulex-alt-tasan-bulten-nl-metin { color: --muted--; }

  .modulex-alt-tasan-bulten-nl-kvkk { color: --muted--; font-size: 0.8rem; line-height: 1.5; }

  footer.modulex-alt-tasan-bulten { padding-block-start: 0; background: linear-gradient(to bottom, --text-- 0 96px, --bg-- 96px); background-color: --bg--; }
  .modulex-alt-tasan-bulten-tasan { padding-block-start: 24px; margin-block-end: clamp(40px, 6vw, 64px); }
  .modulex-alt-tasan-bulten-kart { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px 40px; align-items: center; padding: clamp(24px, 4vw, 44px); border-radius: calc(--yuvarlak-- * 1.4); background-color: --vurguBg--; color: --vurguText--; box-shadow: 0 30px 60px -36px color-mix(in srgb, --bg-- 80%, transparent); }
  .modulex-alt-tasan-bulten-kart :is(.modulex-alt-tasan-bulten-nl-metin, .modulex-alt-tasan-bulten-nl-kvkk, .modulex-alt-tasan-bulten-nl-etiket, .modulex-alt-tasan-bulten-nl-durum) { color: inherit; }
  .modulex-alt-tasan-bulten-kart .modulex-alt-tasan-bulten-nl-girdi { border-color: transparent; background-color: --vurguText--; color: --vurguBg--; }
  .modulex-alt-tasan-bulten-kart .modulex-alt-tasan-bulten-nl-dugme { background-color: --bg--; color: --text--; }
  .modulex-alt-tasan-bulten-kart :where(a, button, input):focus-visible { outline-color: --vurguText--; }
  .modulex-alt-tasan-bulten-sutunlar { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(4, minmax(0, 1fr)); gap: 32px; }
  .modulex-alt-tasan-bulten-marka { display: grid; align-content: start; gap: 18px; }
  .modulex-alt-tasan-bulten-blok--sosyal .modulex-alt-tasan-bulten-bbaslik { margin-block-end: 10px; }
  .modulex-alt-tasan-bulten-alt { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px; margin-block-start: 48px; padding-block-start: 24px; border-block-start: 1px solid --cizgi--; }
  .modulex-alt-tasan-bulten-alt .modulex-alt-tasan-bulten-telif { margin-inline-end: auto; }
  .modulex-alt-tasan-bulten-yasal { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.9rem; }
  @media (max-width: 1024px) {
    .modulex-alt-tasan-bulten-sutunlar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .modulex-alt-tasan-bulten-marka { grid-column: 1 / -1; }
    .modulex-alt-tasan-bulten-kart { grid-template-columns: minmax(0, 1fr); }

  @media (max-width: 768px) {
    .modulex-alt-tasan-bulten-sutunlar { grid-template-columns: minmax(0, 1fr); }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-alt-tasan-bulten :is(.modulex-alt-tasan-bulten-baslik, .modulex-alt-tasan-bulten-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-alt-tasan-bulten-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-alt-tasan-bulten { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-alt-tasan-bulten *, .modulex-alt-tasan-bulten *::before, .modulex-alt-tasan-bulten *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-alt-tasan-bulten";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const form = (s, P) => {
        s.querySelectorAll("form[data-fb-form]").forEach((f) => {
          const durum = f.querySelector("[role=status]");
          const yaz = (m, hata) => { if (durum) { durum.textContent = m || ""; durum.classList.toggle(P + "-durum--hata", !!hata); } };
          let t0 = Date.now();
          const al = (ad) => { const e = f.elements.namedItem(ad); return e && "value" in e ? String(e.value).trim() : ""; };
          const etiket = (ad) => { const e = f.elements.namedItem(ad); const l = e && e.id ? f.querySelector(`label[for="${e.id}"]`) : null; return l ? l.textContent.trim() : ad; };
          const konuMetin = () => { const e = f.elements.namedItem("topic"); return e && e.selectedIndex > 0 ? e.options[e.selectedIndex].text.trim() : ""; };
          f.addEventListener("submit", (e) => {
            e.preventDefault();
            if (!f.checkValidity()) { f.reportValidity(); return; }
            if (al("website")) return;
            const govde = ["name", "email", "phone"].filter(al).map((k) => `${etiket(k)}: ${al(k)}`)
              .concat(konuMetin() ? [`${etiket("topic")}: ${konuMetin()}`] : [], al("message") ? ["", al("message")] : []).join("\n");
            const d = f.dataset;
            if (d.action) {
              const b = f.querySelector("[type=submit]");
              if (b) b.disabled = true;
              const yuk = { name: al("name"), email: al("email"), phone: al("phone"), topic: konuMetin(), message: al("message"), kvkk: true, lang: document.documentElement.lang || "", page: location.pathname, website: al("website"), t: Date.now() - t0 };
              fetch(d.action, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(yuk) })
                .then((r) => r.json().catch(() => ({})).then((j) => r.ok && j && j.ok !== false))
                .then((ok) => { if (b) b.disabled = false; yaz(ok ? d.ok : d.hata, !ok); if (ok) { f.reset(); t0 = Date.now(); } })
                .catch(() => { if (b) b.disabled = false; yaz(d.hata, true); });
              return;
            }
            if (d.gonderim === "whatsapp" && d.wa) { window.open(`https://wa.me/${d.wa}?text=${encodeURIComponent(govde)}`, "_blank", "noopener"); return; }
            if (d.eposta) {
              const konu = [d.konu || "", konuMetin()].filter(Boolean).join(" - ");
              location.href = `mailto:${d.eposta}?subject=${encodeURIComponent(konu)}&body=${encodeURIComponent(govde.replace(/\n/g, "\r\n"))}`;
            }
          });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      form(s, P, az);
    });
  })();
</script>
