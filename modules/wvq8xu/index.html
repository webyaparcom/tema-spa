<style>
  /* ekip-konusma-balonu — Ekip kendi ağzından konuşur (birinci tekil ton); insan odaklı, samimi markalar için. */
  .modulex-ekip-konusma-balonu { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-ekip-konusma-balonu *, .modulex-ekip-konusma-balonu *::before, .modulex-ekip-konusma-balonu *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-ekip-konusma-balonu :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-ekip-konusma-balonu :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-ekip-konusma-balonu :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-ekip-konusma-balonu :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-ekip-konusma-balonu img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-ekip-konusma-balonu) img { height: auto; }
  .modulex-ekip-konusma-balonu [hidden] { display: none !important; }
  .modulex-ekip-konusma-balonu :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-ekip-konusma-balonu :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-ekip-konusma-balonu-ic { max-width: --max--; margin-inline: auto; }
  .modulex-ekip-konusma-balonu-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-ekip-konusma-balonu--bassiz .modulex-ekip-konusma-balonu-bas { display: none; }
  .modulex-ekip-konusma-balonu-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-ekip-konusma-balonu-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-ekip-konusma-balonu-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-ekip-konusma-balonu-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-ekip-konusma-balonu-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-ekip-konusma-balonu-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-ekip-konusma-balonu-dugme:hover { transform: translateY(-2px); }
  .modulex-ekip-konusma-balonu-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-ekip-konusma-balonu-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-ekip-konusma-balonu-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-ekip-konusma-balonu-izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 34px 26px; align-items: end; }
  .modulex-ekip-konusma-balonu-uye { display: grid; gap: 18px; transition: opacity 0.6s ease, transform 0.6s ease; transition-delay: calc(var(--i) * 80ms); }
  .modulex-ekip-konusma-balonu--hazir:not(.modulex-ekip-konusma-balonu--gor) .modulex-ekip-konusma-balonu-uye { opacity: 0; transform: translateY(16px); }
  .modulex-ekip-konusma-balonu-balon { position: relative; padding: 22px 24px; border-radius: --yuvarlak--; background-color: --kartBg--; }
  .modulex-ekip-konusma-balonu-balon::after { content: ""; position: absolute; inset-block-start: 100%; inset-inline-start: 34px; border: 12px solid transparent; border-block-start-color: --kartBg--; border-block-end: 0; }
  .modulex-ekip-konusma-balonu-balon .modulex-ekip-konusma-balonu-bio { color: --text--; font-size: 1rem; font-style: italic; }
  .modulex-ekip-konusma-balonu-kim { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 12px; padding-inline-start: 18px; }
  .modulex-ekip-konusma-balonu-foto { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; font-size: 1rem; }
  .modulex-ekip-konusma-balonu-yazi { display: grid; gap: 0; }
  .modulex-ekip-konusma-balonu-ad { font-size: 1rem; }
  .modulex-ekip-konusma-balonu-unvan { font-size: 0.85rem; }
  @media (max-width: 768px) {
    .modulex-ekip-konusma-balonu-izgara { gap: 26px; }
  }
  /* img width/height öznitelikleri CSS yüksekliği olur — aspect-ratio'nun çalışması için yükseklik auto (modül kuralı ezebilir) */
  :where(.modulex-ekip-konusma-balonu) img { height: auto; }
  .modulex-ekip-konusma-balonu-foto { min-width: 0; }
  .modulex-ekip-konusma-balonu-bag { color: inherit; text-decoration: none; }
  .modulex-ekip-konusma-balonu-bag:hover { text-decoration: underline; text-underline-offset: 4px; }
  .modulex-ekip-konusma-balonu-harf { display: grid; place-items: center; background-color: --vurguBg--; color: --vurguText--; font-weight: 800; letter-spacing: 0.02em; }
  .modulex-ekip-konusma-balonu-sosyal { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-ekip-konusma-balonu-slink { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 40px; min-height: 40px; padding: 0 10px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-size: 0.88rem; text-decoration: none; transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
  .modulex-ekip-konusma-balonu-slink:hover { background-color: --accent--; border-color: --accent--; color: --accentText--; }
  .modulex-ekip-konusma-balonu-slink .material-symbols-outlined { font-size: 19px; }
  .modulex-ekip-konusma-balonu-syazi { overflow-wrap: anywhere; }
  .modulex-ekip-konusma-balonu-ad { font-size: 1.12rem; font-weight: 750; line-height: 1.3; }
  .modulex-ekip-konusma-balonu-unvan { color: --accentInk--; font-size: 0.92rem; font-weight: 650; }
  .modulex-ekip-konusma-balonu-bio { color: --muted--; font-size: 0.95rem; line-height: 1.65; }
  .modulex-ekip-konusma-balonu-bolum { color: --muted--; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ekip-konusma-balonu :is(.modulex-ekip-konusma-balonu-baslik, .modulex-ekip-konusma-balonu-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ekip-konusma-balonu-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ekip-konusma-balonu { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ekip-konusma-balonu *, .modulex-ekip-konusma-balonu *::before, .modulex-ekip-konusma-balonu *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ekip-konusma-balonu";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
